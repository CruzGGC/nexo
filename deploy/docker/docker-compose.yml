services:
  app:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.app
    container_name: nexo-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      POCKETBASE_URL: http://pocketbase:8090
      ORIGIN: ${APP_BASE_URL:-http://localhost:3000}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexo_internal
    volumes:
      - app_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.25.9
    container_name: nexo-pocketbase
    expose:
      - "8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexo_internal
    volumes:
      - pocketbase_data:/pb/pb_data
      - pocketbase_public:/pb/pb_public
    deploy:
      resources:
        limits:
          memory: 256M

  jobs:
    image: alpine:3.20
    container_name: nexo-jobs
    env_file:
      - .env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Installing cron..."
        # Copy backup script
        chmod +x /scripts/backup.sh
        # Set up nightly backup cron (02:00 UTC)
        echo "0 2 * * * /scripts/backup.sh >> /var/log/backup.log 2>&1" | crontab -
        echo "[$(date -Iseconds)] Jobs container started. Cron scheduled."
        crond -f -l 2
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexo_internal
    volumes:
      - backup_output:/backup
      - pocketbase_data:/pb_data:ro
      - ./backup.sh:/scripts/backup.sh:ro
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  nexo_internal:
    driver: bridge

volumes:
  pocketbase_data:
  pocketbase_public:
  app_logs:
  backup_output:
